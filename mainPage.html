<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>To-Do List</title>


    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>


    <!-- ===== MAIN APPLICATION ===== -->
    <div class="app">




        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">


            <!-- Logo / Title -->
            <div class="sidebar-header">


                <div class="logo">✓</div>
                <span>To-Do List</span>

                <button class="menu"> 
                <span>≡</span>  
                </button>


            </div>


            <!-- Categories -->
            <div class="categories">


                <p class="category-title">CATEGORIES</p>


                <button class="category active">
                    <span>All</span>
                    <span>8</span>
                </button>


                <button class="category">
                    <span>Work</span>
                    <span>3</span>
                </button>


                <button class="category">
                    <span>Study</span>
                    <span>3</span>
                </button>


                <button class="category">
                    <span>Personal</span>
                    <span>1</span>
                </button>


                <button class="category">
                    <span>Shopping</span>
                    <span>1</span>
                </button>


                <button class="category">
                    <span>Other</span>
                    <span>0</span>
                </button>


            </div>


            <!-- Overdue Task -->
                <button class="overdue"> ⚠ 1 overdue task</button>


        </aside>




        <!-- ===== MAIN CONTENT ===== -->
        <main>
            <!-- ===== HEADER ===== -->
            <header class="header">


                <div class="welcome">


                    <h1 id="welcome-message">Welcome back! 👋</h1>
                    <p id="current-date"></p>


                </div>


                <div class="header-actions">
                    <input type="search" placeholder="🔍  Search tasks...">
                    <button class="notification" aria-label="View notifications">🔔</button>
                    <button class="profile" aria-label="Open user profile">JB</button>
                </div>




            </header>



            <!-- ===== PAGE CONTENT ===== -->
            <section class="content">




                <!-- ===== OVERALL PROGRESS ===== -->
                <section class="progress-card">


                    <div class="progress-header">


                        <h3>OVERALL PROGRESS</h3>
                        <span>38%</span>


                    </div>


                    <div class="progress-bar">


                        <div class="progress-fill"></div>


                    </div>


                    <p>3 of 8 tasks completed</p>


                </section>




                <!-- ===== ADD NEW TASK ===== -->
                <section class="add-task">


                    <h2>ADD NEW TASK</h2>
                    <div class="add-task-row">


                        <div class="task-input">


                            <span>＋</span>
                            <input type="text" placeholder="Enter your task...">


                        </div>


                        <button class="add-button"> ＋ Add Task</button>


                    </div>


                </section>






                <!-- ===== SUMMARY CARDS ===== -->
                <section class="summary">




                    <!-- Total -->
                    <div class="summary-card">


                        <div class="summary-title">
                            TOTAL TASKS
                        </div>


                        <strong class="blue-number">8</strong>


                    </div>




                    <!-- Completed -->
                    <div class="summary-card">


                        <div class="summary-title">
                            COMPLETED
                        </div>


                        <strong class="green-number">3</strong>


                    </div>




                    <!-- Pending -->
                    <div class="summary-card">


                        <div class="summary-title">
                            PENDING
                        </div>


                        <strong class="yellow-number">5</strong>


                    </div>


                </section>






                <!-- ===== TASK LIST ===== -->
                <section class="tasks">




                    <!-- Tasks Header -->
                    <div class="tasks-header">


                        <h2>Tasks</h2>


                        <div class="filters">


                            <button class="filter active">
                                All <span>8</span>
                            </button>


                            <button class="filter">
                                Pending <span>5</span>
                            </button>


                            <button class="filter">
                                Completed <span>3</span>
                            </button>


                        </div>


                    </div>







                </section>


            


        


                </div>

    <!-- Custom Toast Notification -->
<div id="toast" class="toast">
  <p id="toast-message"></p>
</div>

<!-- Custom Confirmation Modal -->
<div id="confirmation-modal" class="modal">
  <div class="modal-content">
    <h3 id="confirm-title"></h3>
    <p id="confirm-message"></p>
    <div class="modal-buttons">

      <button id="confirm-yes" class="confirm-button">Confirm</button>
      <button id="confirm-no" class="cancel-button">Cancel</button>
    </div>
  </div>
</div>

                                <div class="form-group">
                                    <label for="edit-task-recurring">Recurring</label>
                                    <select id="edit-task-recurring" name="editTaskRecurring">
                                        <option value="none">None</option>
                                        <option value="daily">Daily</option>
                                        <option value="weekly">Weekly</option>
                                        <option value="monthly">Monthly</option>
                                    </select>
                                </div>
                            </div>

                            <div class="reminder">
                                <input type="checkbox" id="edit-task-reminder" name="editTaskReminder">
                                <label for="edit-task-reminder">Set reminder for this task</label>
                            </div>

                            <div class="modal-buttons">
                                <button type="button" class="cancel-edit-button">Cancel</button>
                                <button type="button" class="save-edit-button">Save Changes</button>


                            </div>
                        </div>
                    </div>
            </section>  
        </main>

    </div>

</body>
</html>
