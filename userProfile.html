<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>User Profile</title>


    <link rel="stylesheet" href="style.css">
</head>


<body>


    <!-- ===== USER PROFILE ===== -->


    <div class="profile-page">


        <div class="profile-card">


            <!-- Close Button -->
            <button class aria-label ="close-profile" onclick="window.location.href='mainPage.html'">
                ×
            </button>




            <!-- Profile Header -->
            <div class="profile-header">


                <div class="profile-avatar">
                    JB
                </div>


                <h1>User Profile</h1>


            </div>




            <!-- Personal Information -->
            <div class="personal-info">


                <h2>Personal Information</h2>




                <!-- Full Name -->
                <div class="profile-field">


                    <label>Full Name</label>


                    <p id="profile-name">
                        Jeera Boy        <!--Jeera is my dog name , ginawa ko nlang munang hard coded and 1 user profile for testing-->
                    </p>


                </div>




                <!-- Email -->
                <div class="profile-field">


                    <label>Email Address</label>


                    <p id="profile-email">
                        jeeraboy@example.com
                    </p>


                </div>




                <!-- Occupation -->
                <div class="profile-field">


                    <label>Occupation</label>


                    <p id="profile-occupation">
                        IT Professional
                    </p>


                </div>


            </div>




            <!-- Actions -->
            <div class="profile-actions">


                <button id="logout-button">Log Out</button>


            </div>


        </div>


    </div>


    <script src="function.js"></script>


</body>


</html>
